name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la qualité du code
        run: npm run lint

  build:
    name: Build & TypeScript (Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler TypeScript et builder l'application
        run: npm run build

  server:
    name: TypeScript (Backend Server)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier la présence du serveur
        id: check_server
        run: |
          if [ -f "server/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Configurer Node.js
        if: steps.check_server.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances du serveur
        if: steps.check_server.outputs.exists == 'true'
        working-directory: ./server
        run: npm install

      - name: Vérifier les types TypeScript du serveur
        if: steps.check_server.outputs.exists == 'true'
        working-directory: ./server
        run: npx tsc --noEmit

